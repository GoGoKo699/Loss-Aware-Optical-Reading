name: Apply and verify bounded theory repair
on:
  push:
    branches: [repair/theory-01]
    paths:
      - 'repairs/theory-01/transport/**'
      - '.github/workflows/apply-theory-repair-01.yml'
permissions:
  contents: write
concurrency:
  group: apply-theory-repair-01
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repair/theory-01
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Verify preimages, apply the scoped repair, test and commit on repair branch only
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python repairs/theory-01/transport/apply.py
