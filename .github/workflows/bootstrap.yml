name: Restore and verify checkpoint 07
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_import.py'
      - 'scripts/initialize.py'
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
concurrency:
  group: checkpoint07-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Verify and restore original bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/initialize.py
      - run: python -m pip install -r requirements-recorded.txt
      - name: Verify, test and reproduce without replacing archived results
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_import.py
          mkdir -p provenance/migration07
          python -m unittest discover -s tests -v 2>&1 | tee provenance/migration07/unit-tests.log
          python scripts/reproduce.py --output provenance/migration07/run
          python scripts/record_import.py
      - name: Commit verified normal repository files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import checkpoint 07 with exact provenance, safe reproduction and fresh validation'
          git push origin HEAD:main
