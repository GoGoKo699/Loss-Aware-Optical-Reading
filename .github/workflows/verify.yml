name: Verify research baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require a clean starting checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install recorded runtime and independent test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify complete original inventory and authorized repairs
        run: python scripts/verify_import.py
      - name: Run engineering and exact-bound regression tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce inherited checks without changing frozen outputs
        run: python scripts/reproduce.py --output results/runs/ci
      - name: Reproduce historical defects and repaired independent science cases
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python repairs/theory-01/verify.py --output results/runs/ci-repair
      - name: Require unchanged working tree and no bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/bootstrap.yml
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record verified commit and check summaries
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          r=json.loads(Path('results/runs/ci/REPRODUCTION.json').read_text())
          a=json.loads(Path('results/runs/ci-repair/SUMMARY.json').read_text())
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          lines=['## Verified research baseline and F01-F03 repair',
              f'- Commit: `{commit}`',
              f"- Original archive: `{r['integrity']['archive_sha256']}`",
              f"- Original members: {r['integrity']['source_members']}",
              f"- Inherited checks: {r['fresh_summary']['checks']}, {r['reference_comparison']}",
              f"- Historical audit checks: {a['historical_audit_checks']}",
              f"- Repaired scientific checks: {a['repaired_scientific_checks']}",
              '- Unit tests and clean-tree checks passed.',
              '- No laboratory data or novelty clearance; only photon support uses exact-rational enclosures.']
          text='\n'.join(lines)+'\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as stream:stream.write(text)
          PY
