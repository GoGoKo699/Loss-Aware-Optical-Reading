name: Verify research baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record the checkout and require a clean starting tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install the recorded numerical environment
        run: python -m pip install -r requirements-recorded.txt
      - name: Verify original bytes and protected working files
        run: python scripts/verify_import.py
      - name: Require a complete one-to-one archive inventory
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          manifest = json.loads(Path('provenance/IMPORT_MANIFEST.json').read_text())
          prefix = 'photonic_single_photon_checkpoint_07/'
          with ZipFile(manifest['archive']) as archive:
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
          if not all(name.startswith(prefix) for name in names):
              raise SystemExit('Unexpected archive root')
          sources = [entry['source'] for entry in manifest['files']]
          targets = [entry['path'] for entry in manifest['files']]
          if len(sources) != len(set(sources)) or len(targets) != len(set(targets)):
              raise SystemExit('Duplicate source or installed path in import manifest')
          if sorted(name[len(prefix):] for name in names) != sorted(sources):
              raise SystemExit('Import manifest does not cover the complete archive')
          if Path('.github/workflows/bootstrap.yml').exists():
              raise SystemExit('The one-time import workflow must not remain active')
          print(f'Complete archive inventory: {len(sources)} unique source members')
          PY
      - name: Run engineering regression tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce checkpoint 07 into a new directory
        run: python scripts/reproduce.py --output results/runs/ci
      - name: Ensure the working tree and tracked evidence did not change
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Record the verified commit and reproduction summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          report = json.loads(Path('results/runs/ci/REPRODUCTION.json').read_text())
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          summary = report['fresh_summary']
          lines = [
              '## Verified research baseline',
              f'- Commit: `{commit}`',
              f"- Original archive: `{report['integrity']['archive_sha256']}`",
              f"- Original source members: {report['integrity']['source_members']}",
              f"- Checkpoint 07: {summary['checks']} checks, {summary['status']}",
              f"- Frozen-reference comparison: {report['reference_comparison']}",
              '- Engineering tests and clean-tree checks passed.',
              '- This is migration/regression verification, not a new scientific or novelty audit.',
          ]
          text = '\n'.join(lines) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write(text)
          PY
